name: Semantic tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run semantic and independent-oracle tests
        run: python -m unittest discover -s tests -v
      - name: Exercise CLI
        run: python -m natatl_positional check examples/switch.txt --formula '<{1},2>F goal'
